version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: okdriver_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pothole_db}
      POSTGRES_USER: ${POSTGRES_USER:-pothole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password_in_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pothole_user} -d ${POSTGRES_DB:-pothole_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okdriver_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pothole_user}:${POSTGRES_PASSWORD:-change_this_secure_password_in_prod}@db:5432/${POSTGRES_DB:-pothole_db}
      ENVIRONMENT: production
    volumes:
      - uploads_data_prod:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okdriver_frontend_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_prod:
  uploads_data_prod:
